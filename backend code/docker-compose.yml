version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscription-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongo:27017/subscription_management
      - AUTO_MEMORY_DB=false
      - JWT_SECRET=production_ready_jwt_super_secret_subscription_flow_key_987654321
      - JWT_EXPIRES_IN=7d
      - REFRESH_TOKEN_EXPIRES_IN=30d
      - COMPANY_NAME=SubFlow Cloud Solutions Ltd.
      - COMPANY_EMAIL=billing@subflow.io
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173
      - ENABLE_CRON_JOBS=true
      - CRON_INTERVAL_MS=60000
    depends_on:
      - mongo
    networks:
      - subflow-network

  mongo:
    image: mongo:7.0
    container_name: subscription-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - subflow-network

volumes:
  mongo-data:
    driver: local

networks:
  subflow-network:
    driver: bridge

